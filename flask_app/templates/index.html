{% extends "base.html" %}

{% block content %}
<div class="page-center">
    <div class="container">
        <div class="header">
            <h2>Laptop Price Predictor</h2>
            <p class="subtitle">Select specs to estimate the price</p>
        </div>
        <form id="predictionForm">
            <div class="field">
                <label for="Brand">Brand</label>
                <select name="Brand">
                    {% for b in options.Brand %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="processor_brand">Processor Brand</label>
                <select name="processor_brand">
                    {% for p in options.processor_brand %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="processor_series">Processor Series</label>
                <select name="processor_series">
                    {% for s in proc_series_map[options.processor_brand[0]] %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="processor_tier">Processor Tier</label>
                <select name="processor_tier">
                    {% for t in proc_tier_map[options.processor_brand[0]] %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="ram">Ram</label>
                <select name="ram">
                    {% for r in options.ram %}
                    <option value="{{ r }}">{{ r }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="storage">Storage</label>
                <select name="storage">
                    {% for s in options.storage %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="screen_size">Screen Size</label>
                <select name="screen_size">
                    {% for d in options.screen_size %}
                    <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="display_type">Display Type</label>
                <select name="display_type">
                    {% for d in options.display_type %}
                    <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="gpu_brand">Gpu Brand</label>
                <select name="gpu_brand">
                    {% for g in options.gpu_brand %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="gpu_model">Gpu Model</label>
                <select name="gpu_model">
                    {% for m in gpu_model_map[options.gpu_brand[0]] %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="vram">Vram</label>
                <select name="vram">
                    {% for v in vram_map[options.gpu_brand[0]] %}
                    <option value="{{ v }}">{{ v }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field full">
                <button type="submit">Predict Price</button>
            </div>
            <h3 id="result"></h3>
        </form>
    </div>
</div>

<h3 id="result"></h3>

<script>

document.getElementById("predictionForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(this);

    const data = {};

    formData.forEach((value, key) => {
        data[key] = isNaN(value) || value === ""
            ? value
            : Number(value);
    });

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById("result").innerText =
        "Predicted Price: ₹" + result.predicted_price;
});

const procSeriesMap = {{ proc_series_map | tojson }};
const procTierMap = {{ proc_tier_map | tojson }};
const gpuModelMap = {{ gpu_model_map | tojson }};
const vramMap = {{ vram_map | tojson }};

document.querySelector('[name="processor_brand"]').addEventListener('change', function() {
    const brand = this.value;
    
    const seriesSelect = document.querySelector('[name="processor_series"]');
    seriesSelect.innerHTML = '';
    procSeriesMap[brand].forEach(s => {
        seriesSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
    
    const tierSelect = document.querySelector('[name="processor_tier"]');
    tierSelect.innerHTML = '';
    procTierMap[brand].forEach(t => {
        tierSelect.innerHTML += `<option value="${t}">${t}</option>`;
    });
});

document.querySelector('[name="gpu_brand"]').addEventListener('change', function() {
    const brand = this.value;
    
    const modelSelect = document.querySelector('[name="gpu_model"]');
    modelSelect.innerHTML = '';
    gpuModelMap[brand].forEach(m => {
        modelSelect.innerHTML += `<option value="${m}">${m}</option>`;
    });
    
    const vramSelect = document.querySelector('[name="vram"]');
    vramSelect.innerHTML = '';
    vramMap[brand].forEach(v => {
        vramSelect.innerHTML += `<option value="${v}">${v}</option>`;
    });
});
</script>

{% endblock %}
